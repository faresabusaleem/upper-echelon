<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Reset your password</title></head>
<body style="margin:0;padding:0;background:#0b0b0a;color:#edeae3;font-family:Georgia,'Times New Roman',serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0a;">
<tr><td align="center" style="padding:48px 20px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
<tr><td style="font-size:15px;letter-spacing:0.02em;color:#a39f96;padding-bottom:40px;">Upper Echelon</td></tr>
<tr><td style="font-size:32px;line-height:1.15;color:#edeae3;padding-bottom:20px;">A new password.</td></tr>
<tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#d6d2c9;padding-bottom:32px;">Someone, hopefully you, asked to reset the password for this account. Follow the link to choose a new one.</td></tr>
<tr><td style="padding-bottom:32px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password/update" style="display:inline-block;background:#c2a15f;color:#0b0b0a;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;text-decoration:none;padding:14px 26px;">Choose a new password</a></td></tr>
<tr><td style="font-family:Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;color:#a39f96;">If you did not ask for this, ignore this message. Your password stays as it is.</td></tr>
</table></td></tr></table></body></html>
